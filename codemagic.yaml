workflows:
  spatial-lab-ios-unsigned:
    name: Spatial Lab iOS unsigned release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS release app without code signing
        script: flutter build ios --release --no-codesign
      - name: Package app for personal sideloading
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          zip -qry SpatialLab-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/ios/unsigned/SpatialLab-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
